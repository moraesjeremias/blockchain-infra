---
repositories:
  - name: cilium
    url: https://helm.cilium.io/

releases:
  - name: cilium
    namespace: kube-system
    installed: true
    version: 1.18.6
    chart: cilium/cilium
    atomic: true
    createNamespace: true
    timeout: 120
    values:
      - values.yaml
    set:
      - name: k8sServiceHost
        value: {{ requiredEnv "K8S_CONTROL_PLANE_0_IP" }}

helmDefaults:
  kubeContext: default
