---
repositories:
  - name: prometheus
    url: https://prometheus-community.github.io/helm-charts

releases:
  - name: prometheus
    namespace: infrastructure
    installed: true
    version: 28.6.0
    chart: prometheus/prometheus
    atomic: true
    createNamespace: true
    timeout: 120
    values:
      - values.yaml

helmDefaults:
  kubeContext: default
